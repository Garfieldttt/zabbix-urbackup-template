zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 18d419be9c1b47a9bb99ce1761b55594
      template: 'Template App UrBackup Client Backup'
      name: 'Template App UrBackup Client Backup'
      description: |
        Author: Thomas Rzen
        
        For more information, visit https://github.com/Garfieldttt/zabbix-urbackup-template
      groups:
        - name: Templates
      items:
        - uuid: fd34a3afb6c54a4194695e4a839ef449
          name: urbackup.raw
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/var/log/urbackup-backups.json]'
          value_type: TEXT
          trends: '0'
      discovery_rules:
        - uuid: 8f0b27a63d6843978a704d71035fedf9
          name: urbackup-discover
          type: DEPENDENT
          key: urbackup.discover
          delay: '0'
          item_prototypes:
            - uuid: 1fc4116e64c54a86a71b513dc9937de5
              name: 'Client Connectivity State {#CLIENT}'
              type: DEPENDENT
              key: 'backup.connectivity[{#CLIENT}]'
              delay: '0'
              valuemap:
                name: CONNECTIVITY-STATE
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.Client=="{#CLIENT}")].Online'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: STR_REPLACE
                  parameters:
                    - 'Yes'
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - 'No'
                    - '0'
              master_item:
                key: 'vfs.file.contents[/var/log/urbackup-backups.json]'
              tags:
                - tag: Urbackup
                  value: Client-Connectivity-State
            - uuid: 5d3bad470a5c403a90839ed0c0291bd8
              name: 'Last Backup Time {#CLIENT}'
              type: DEPENDENT
              key: 'backup.last.backup[{#CLIENT}]'
              delay: '0'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.Client=="{#CLIENT}")].Backup_Timestamp'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[/var/log/urbackup-backups.json]'
              tags:
                - tag: Urbackup
                  value: Last-Backup-Time
            - uuid: b661363948dc40439fd35b309d66c3cc
              name: 'Backup State {#CLIENT}'
              type: DEPENDENT
              key: 'backup.state[{#CLIENT}]'
              delay: '0'
              valuemap:
                name: BACKUP-STATE
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.Client=="{#CLIENT}")].Status'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
                - type: STR_REPLACE
                  parameters:
                    - 'no recent backup'
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - ok
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - 'completed with issues'
                    - '2'
                - type: STR_REPLACE
                  parameters:
                    - failed
                    - '3'
                - type: STR_REPLACE
                  parameters:
                    - 'not supported'
                    - '4'
                - type: STR_REPLACE
                  parameters:
                    - unknown
                    - '5'
                - type: REGEX
                  parameters:
                    - disabled
                    - '6'
              master_item:
                key: 'vfs.file.contents[/var/log/urbackup-backups.json]'
              tags:
                - tag: Urbackup
                  value: Backup-State
              trigger_prototypes:
                - uuid: e71b8c0982134aae8706fe9981f34b08
                  expression: 'last(/Template App UrBackup Client Backup/backup.state[{#CLIENT}])=2 and {$BACKUP_TRIGGER_ENABLED_ISSUES:"{#CLIENT}"}=1'
                  name: 'Backup status warning for {#CLIENT}: Completed with issues'
                  priority: WARNING
                - uuid: ad043a66ed684b12ab8b99e482110560
                  expression: 'last(/Template App UrBackup Client Backup/backup.state[{#CLIENT}])=0 and {$BACKUP_TRIGGER_ENABLED_NO_BACKUP:"{#CLIENT}"}=1'
                  name: 'No successful backup for {#CLIENT}: No recent backup'
                  priority: AVERAGE
                  manual_close: 'YES'
            - uuid: 398fece9e36742a6bbe8e21158ca27b7
              name: 'Backup Size {#CLIENT}'
              type: DEPENDENT
              key: 'backup.total.size[{#CLIENT}]'
              delay: '0'
              value_type: FLOAT
              units: '!MB'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.Client=="{#CLIENT}")].Total_Used_Files_MB'
                - type: LTRIM
                  parameters:
                    - '["'
                - type: RTRIM
                  parameters:
                    - '"]'
              master_item:
                key: 'vfs.file.contents[/var/log/urbackup-backups.json]'
              tags:
                - tag: Urbackup
                  value: Backup-Size
          master_item:
            key: 'vfs.file.contents[/var/log/urbackup-backups.json]'
          lld_macro_paths:
            - lld_macro: '{#CLIENT}'
              path: $.Client
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$[*]'
      macros:
        - macro: '{$BACKUP_TRIGGER_ENABLED_ISSUES}'
          value: '1'
          description: 'Enables or disables the backup monitoring trigger. Set to 1 to activate the trigger, or 0 to disable it.'
        - macro: '{$BACKUP_TRIGGER_ENABLED_NO_BACKUP}'
          value: '1'
          description: 'Enables or disables the backup monitoring trigger. Set to 1 to activate the trigger, or 0 to disable it.'
      valuemaps:
        - uuid: ebeb22b4a13c49588f3e198d0e9b8de8
          name: BACKUP-STATE
          mappings:
            - value: '0'
              newvalue: 'No recent backup'
            - value: '1'
              newvalue: Ok
            - value: '2'
              newvalue: 'Completed with issues'
            - value: '3'
              newvalue: Failed
            - value: '4'
              newvalue: 'Not supported'
            - value: '5'
              newvalue: Unknown
            - value: '6'
              newvalue: Disabled
        - uuid: 0a0aa9b6c9714c479f8e102bcf0a4afa
          name: CONNECTIVITY-STATE
          mappings:
            - value: '0'
              newvalue: Offline
            - value: '1'
              newvalue: Online
